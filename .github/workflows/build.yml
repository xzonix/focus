
package com.example.focus

import android.accessibilityservice.AccessibilityService
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import android.os.Handler
import android.os.Looper

class MyAccessibilityService : AccessibilityService() {
    private val handler = Handler(Looper.getMainLooper())
    private var scanPending = false
    private var playerWasVisible = false
    private var lastBackAt = 0L
    private var absentScans = 0

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (event?.packageName?.toString() != INSTAGRAM_PACKAGE) return
        scheduleScans()
    }

    private fun scheduleScans() {
        if (scanPending) return
        scanPending = true
        var attempts = 0

        val scan = object : Runnable {
            override fun run() {
                val root = rootInActiveWindow
                val reelsOpen = root?.let { containsReelsPlayer(it, 0) } ?: false
                root?.recycle()

                if (reelsOpen) {
                    absentScans = 0

                    val now = System.currentTimeMillis()
                    val unlockedUntil = getSharedPreferences(PREFS, MODE_PRIVATE)
                        .getLong(UNLOCK_UNTIL, 0L)

                    if (!playerWasVisible &&
                        now >= unlockedUntil &&
                        now - lastBackAt >= BACK_COOLDOWN_MS
                    ) {
                        playerWasVisible = true
                        lastBackAt = now
                        performGlobalAction(GLOBAL_ACTION_BACK)
                    } else {
                        playerWasVisible = true
                    }
                } else {
                    absentScans++

                    // Al salir del reproductor, Focus vuelve a quedar armado.
                    if (absentScans >= 2) {
                        playerWasVisible = false
                    }
                }

                attempts++
                if (attempts < MAX_SCANS) {
                    handler.postDelayed(this, SCAN_INTERVAL_MS)
                } else {
                    scanPending = false
                }
            }
        }

        handler.post(scan)
    }

    private fun containsReelsPlayer(
        node: AccessibilityNodeInfo,
        depth: Int
    ): Boolean {
        if (depth > MAX_DEPTH) return false

        val id = node.viewIdResourceName?.lowercase().orEmpty()

        val match = (
            id.contains("clips") &&
                listOf(
                    "viewer",
                    "player",
                    "video_container",
                    "media_view",
                    "view_pager"
                ).any { id.contains(it) }
            ) || (
                id.contains("reel") &&
                    (id.contains("viewer") || id.contains("player"))
            )

        if (match) return true

        for (i in 0 until node.childCount) {
            val child = node.getChild(i) ?: continue
            val found = containsReelsPlayer(child, depth + 1)
            child.recycle()
            if (found) return true
        }

        return false
    }

    override fun onInterrupt() {
        handler.removeCallbacksAndMessages(null)
        scanPending = false
    }

    override fun onDestroy() {
        handler.removeCallbacksAndMessages(null)
        super.onDestroy()
    }

    companion object {
        private const val PREFS = "focus_prefs"
        private const val UNLOCK_UNTIL = "desbloqueado_hasta"
        private const val INSTAGRAM_PACKAGE = "com.instagram.android"
        private const val SCAN_INTERVAL_MS = 250L
        private const val MAX_SCANS = 10
        private const val MAX_DEPTH = 28
        private const val BACK_COOLDOWN_MS = 1400L
    }
}
